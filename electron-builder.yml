appId: com.xiaoxiao.agent
productName: Xiaoxiao Agent
asar: true
asarUnpack:
  - "node_modules/node-pty/prebuilds/**"
  - "node_modules/node-pty/build/Release/**"
npmRebuild: false
afterPack: scripts/sign-local-mac.cjs
electronDist: node_modules/electron/dist
directories:
  output: dist
files:
  - src/**/*
  - package.json
  - "!test/**/*"
  - "!scripts/**/*"
  - "!src/*-entry.mjs"
mac:
  icon: build/icon.icns
  extendInfo:
    NSMicrophoneUsageDescription: 开启「开口打断」后，朗读期间使用麦克风在本机检测插话。
  category: public.app-category.productivity
  identity: null
  target:
    - target: dir
      arch: [arm64]
    - target: dmg
      arch: [arm64]
dmg:
  title: Xiaoxiao Agent
  contents:
    - x: 150
      y: 180
      type: file
    - x: 420
      y: 180
      type: link
      path: /Applications
win:
  target: nsis
linux:
  target: AppImage
