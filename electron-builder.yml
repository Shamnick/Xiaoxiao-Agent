appId: com.xiaoxiao.agent
productName: Xiaoxiao Agent
asar: true
electronDist: node_modules/electron/dist
directories:
  output: dist
files:
  - src/**/*
  - package.json
  - "!test/**/*"
  - "!scripts/**/*"
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  identity: null
  target:
    - target: dir
      arch: [arm64]
    - target: dmg
      arch: [arm64]
dmg:
  title: Xiaoxiao Agent
  contents:
    - x: 150
      y: 180
      type: file
    - x: 420
      y: 180
      type: link
      path: /Applications
win:
  target: nsis
linux:
  target: AppImage
